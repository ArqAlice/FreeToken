services:
  freetoken:
    build:
      context: .
      dockerfile: Dockerfile

    image: freetokenfp8-local:cu130
    container_name: freetokenfp8

    ports:
      - "1919:1919"

    volumes:
      # Hugging Face model cache
      - hf-cache:/models/huggingface

      # FreeToken benchmark / kernel cache
      - freetoken-cache:/root/.cache/freetoken

      # Torch / Triton / FlashInfer cache
      - torch-cache:/root/.cache/torch

    environment:
      HF_HOME: /models/huggingface
      HUGGINGFACE_HUB_CACHE: /models/huggingface/hub

      # Enable Hugging Face Hub's high-performance Xet transfer path.
      # This parallelizes range downloads for models stored on Xet while
      # keeping the downloaded files in the persistent hf-cache volume.
      HF_XET_HIGH_PERFORMANCE: "1"

    shm_size: "8gb"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu

    command:
      - serve
      - --model
      - aday777/Qwen3.8-Flash-Next-Uncensored-NVFP4-MTP

      - --host
      - 0.0.0.0

      - --port
      - "1919"

      - --max-running-requests
      - "2"

      - --max-seq-len-override
      - "1000128"

      - --kv-reserve-tokens
      - "1000128"

      - --kv-cache-dtype
      - "nvfp4"

      - --mtp-speculative-tokens
      - "0"

      - --max-prefill-length
      - "8192"

volumes:
  hf-cache:
  freetoken-cache:
  torch-cache: